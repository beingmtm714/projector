# Publish site/ to GitHub Pages on every push to main.
#
# Replaces Netlify, which stopped deploying because the project was never
# connected to this repository: pushes went to GitHub and the live site sat on
# a manual upload from 1 September. Nothing here depends on a token that can
# expire out from under it.
#
# There is no build step. The pages are generated locally by tools/build-docs.py
# and tools/build-wireframes.py and reviewed before they are pushed, so a broken
# build is never a live one. This workflow only uploads what is committed.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, so a rapid second push
# queues behind the first rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
