# Only site/ is served. The document sources are Markdown in the vault, the
# artboard sources are in wireframes/, and the build scripts are in tools/.
# None of it is reachable from the web, by construction rather than by
# robots.txt. Netlify serves what is committed; there is no build step here,
# because the pages are generated locally and reviewed before they are pushed.
[build]
  publish = "site"
  command = ""

# The investor deck and the pre-seed memo. Reachable by link, never in an index.
# Crawlers must be ALLOWED to fetch these or they cannot read the noindex
# directive, but the gate answers them with a 401 before a body is ever sent.
[[headers]]
  for = "/docs/private/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# The rest of the site is a working document, not something to be indexed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
